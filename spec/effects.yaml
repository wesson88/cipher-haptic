# CipherHaptic effects SSOT · v1.3.0 · 2026-08-02
# 唯一真相源：iOS/Android loader 与调音台均读此处。
# 每个 effect 下的 "# t=" 注释是双端脉冲起点对拍结果（见 §1.1），改数据必须同步改注释。
# 运行时读取路径：ios_core_haptics.events（中立事件源）→ 降级（§3.1）→ IRTranslator 生成双端对象。
#   android.* 块是【镜像】,仅供 CI diff 校验,运行时不读。
version: "1.3.0"

effects:

  glitch_dissolve:                  # 文本粒子崩解震：3 段叠加 transient，末段最强
    category: ux
    ios_core_haptics:
      events:                                                                  # t= 0 / 40 / 100
        - { type: hapticTransient, time_ms: 0,   duration_ms: 20, intensity: 0.80, sharpness: 0.70 }
        - { type: hapticTransient, time_ms: 40,  duration_ms: 20, intensity: 0.60, sharpness: 0.60 }
        - { type: hapticTransient, time_ms: 100, duration_ms: 20, intensity: 0.95, sharpness: 0.85 }
    android:
      min_api: 29
      waveform:                                                                # t= 0 / 40 / 100 ✓
        timings_ms: [20, 20, 20, 40, 20]     # 脉冲20 静20 | 脉冲20 静40 | 脉冲20
        amplitudes: [204, 0, 153, 0, 242]    # 0.80/0.60/0.95 × 255

  ticket_rip:                       # 高街热敏纸撕纸震：阻尼 continuous + 末点撕断 transient
    category: ux
    ios_core_haptics:
      events:                                                                  # 阻尼 0-200，撕断 t=200
        - { type: hapticContinuous, time_ms: 0,   duration_ms: 200, intensity: 0.35, sharpness: 0.20 }
        - { type: hapticTransient,  time_ms: 200, duration_ms: 30, intensity: 1.00, sharpness: 0.90 }
    android:
      min_api: 29
      waveform:                                                                # 阻尼 0-200，撕断 t=200 ✓
        timings_ms: [200, 30]                # 阻尼段200 | 撕断脉冲30
        amplitudes: [89, 255]                # 0.35×255=89；无间隙,振幅跃变即"绷断"

  magnetic_snap:                    # 多巴胺流体吸附震：2 段紧凑 transient，钝击回弹
    category: ux
    ios_core_haptics:
      events:                                                                  # t= 0 / 40
        - { type: hapticTransient, time_ms: 0,  duration_ms: 20, intensity: 0.45, sharpness: 0.25 }
        - { type: hapticTransient, time_ms: 40, duration_ms: 20, intensity: 0.75, sharpness: 0.35 }
    android:
      min_api: 30
      composition:                                                             # t= 0 / 40 ✓
        primitives:                          # delay_ms = 本原语相对上一原语的前置延迟
          - { type: PRIMITIVE_CLICK, scale: 0.45, delay_ms: 0 }
          - { type: PRIMITIVE_CLICK, scale: 0.75, delay_ms: 40 }
        requires_primitives: [PRIMITIVE_CLICK]   # 运行时须过 areAllPrimitivesSupported
      fallback_api_lt_30:           # API<30 或原语不受支持
        waveform:                                                              # t= 0 / 40 ✓
          timings_ms: [20, 20, 20]
          amplitudes: [115, 0, 191]          # 0.45/0.75 × 255

  anti_screenshot:                  # 防窥入侵紧急强震：4 段全功率 transient 断奏，间隔 80ms
    category: critical
    ios_core_haptics:
      events:                                                                  # t= 0 / 80 / 160 / 240
        - { type: hapticTransient, time_ms: 0,   duration_ms: 30, intensity: 1.00, sharpness: 1.00 }
        - { type: hapticTransient, time_ms: 80,  duration_ms: 30, intensity: 1.00, sharpness: 1.00 }
        - { type: hapticTransient, time_ms: 160, duration_ms: 30, intensity: 1.00, sharpness: 1.00 }
        - { type: hapticTransient, time_ms: 240, duration_ms: 30, intensity: 1.00, sharpness: 1.00 }
    android:
      min_api: 29
      waveform:                                                                # t= 0 / 80 / 160 / 240 ✓
        timings_ms: [30, 50, 30, 50, 30, 50, 30]   # 脉冲30ms(非40,避免闷顿) + 静默50ms
        amplitudes: [255, 0, 255, 0, 255, 0, 255]

  message_ping:                     # 消息提示双击震（alert 档唯一实例，见 §四说明）
    category: alert
    ios_core_haptics:
      events:                                                                  # t= 0 / 120
        - { type: hapticTransient, time_ms: 0,   duration_ms: 25, intensity: 0.70, sharpness: 0.55 }
        - { type: hapticTransient, time_ms: 120, duration_ms: 25, intensity: 0.50, sharpness: 0.45 }
    android:
      min_api: 29
      waveform:                                                                # t= 0 / 120 ✓
        timings_ms: [25, 95, 25]
        amplitudes: [179, 0, 128]            # roundHalfUp(0.70/0.50 × 255)；178.5→179, 127.5→128

  default_ui_click:                 # 普通 UI 点击：单次轻微 transient
    category: ux
    ios_core_haptics:
      events:                                                                  # t= 0
        - { type: hapticTransient, time_ms: 0, duration_ms: 15, intensity: 0.50, sharpness: 0.50 }
    android:
      min_api: 30
      composition:                                                             # t= 0 ✓
        primitives:
          - { type: PRIMITIVE_CLICK, scale: 0.50, delay_ms: 0 }
        requires_primitives: [PRIMITIVE_CLICK]
      fallback_api_lt_30:
        waveform:                                                              # t= 0 ✓
          timings_ms: [15]
          amplitudes: [128]

  gesture_continuous:               # 连续手势通道（updateContinuousEffect 的载体，非 one-shot）
    kind: continuous                # 生命周期由 update/end 驱动，无固定 duration
    category: ux
    # ── 中立连续参数（v1.3.0 新增,是 ResolvedWaveform.continuous 的唯一来源）──
    # 此前这四个值只以【平台形态】散落在下面两个块里（iOS duration_ms:30000 / Android segment_ms:120）,
    # 而 IR schema 里没有承载它们的字段 —— IRTranslator 只能回头读 effects.yaml,
    # 「IR 是通用层与平台层的唯一接缝」当场破掉。见 IR 文档 §3.2b。
    continuous:
      initial_intensity: 0.50
      initial_sharpness: 0.50
      max_duration_ms:   30000      # 单次排程上限；到期由运行时续排,不是效果总时长
      segment_ms:        120        # 分段粒度；有原生连续通道的平台忽略此值
      idle_timeout_ms:   null       # ★ 待实测（性能 §5.4）；null = loader 用内置默认并告警
    ios_core_haptics:               # ← 镜像,由 continuous 块派生,勿手改
      events:
        - { type: hapticContinuous, time_ms: 0, duration_ms: 30000,
            intensity: 0.50, sharpness: 0.50 }
      dynamic_parameters: [hapticIntensityControl, hapticSharpnessControl]
    android:                        # ← 镜像,由 continuous 块派生,勿手改
      min_api: 29
      # Android 无 continuous 语义：以"恒振幅分段 + 参数变化时取消当前段重排"近似（见 P-01）
      sustain:
        segment_ms: 120
        amplitude_from: intensity   # sharpness 在 Android 无对应维度，忽略
