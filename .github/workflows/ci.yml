name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: CI 规则 + FSM 不变式 + fuzz
        run: python -B tools/check.py --fuzz 20000
      - name: golden 新鲜度（参考实现重生成后必须与仓库逐字节一致）
        run: |
          python tools/golden.py
          git diff --exit-code -- spec/golden.json
      - name: iOS 内嵌副本与 spec 一致（SwiftPM 资源引用不到 spec/，由 extract.py 同步写入）
        run: cmp spec/runtime.min.json ios/Sources/CipherHapticCore/Resources/runtime.min.json
      # extract.py --check（vault → spec/ 逐字节对拍）需要本地 vault，CI 上跑不了；开发机提交前手动跑

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: core 单测 + 库层单测（JUnit5 + mockk）+ demo 构建
        working-directory: android
        # 公开仓库的 job 日志需鉴权才能读，annotation 不需要 —— 编译错误与失败用例转成 annotation
        run: |
          set -o pipefail
          gradle -I ../.github/ci.init.gradle :core:test :library:testDebugUnitTest :demo:assembleDebug --console=plain --continue 2>&1 | tee build.log
      - name: 失败详情转 annotation
        if: failure()
        working-directory: android
        run: python3 ../.github/annotate.py build.log

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 纯逻辑 + facade（fake gateway）单测（macOS 主机，含 golden 对拍）
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift.log
      - name: 编译错误 / 失败用例转 annotation
        if: failure()
        run: |
          grep -E ": error: " swift.log | sort -u | sed -E 's/^([^:]+):([0-9]+):[0-9]+: error: (.*)$/::error file=\1,line=\2::\3/' || true
          grep -E "XCTAssert|failed \(" swift.log | head -40 | sed -E 's/^/::error::/' || true
      - name: Core Haptics / UIKit 层编译 + 全部测试（iOS 模拟器）
        # 公开仓库的 job 日志需鉴权才能读，annotation 不需要
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator: $UDID"
          xcodebuild test -scheme CipherHaptic-Package -destination "id=$UDID" > build.log 2>&1 || true
          grep -E ": error: " build.log | sort -u | sed -E 's/^([^:]+):([0-9]+):[0-9]+: error: (.*)$/::error file=\1,line=\2::\3/' || true
          grep -E "xcodebuild: error|error: -\[" build.log | head -20 | sed -E 's/^/::error::/' || true
          tail -30 build.log
          grep -q "TEST SUCCEEDED" build.log
